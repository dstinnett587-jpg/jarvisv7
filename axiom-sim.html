<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J · AXIOM SIM</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border:1px solid #333;background:#111;color:#fff;border-radius:999px;padding:10px 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{border:1px solid #2c2c2c;background:#0d0d0d;border-radius:16px;padding:16px}.muted{color:#aaa;font-size:13px;line-height:1.5}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row input{width:100%;padding:11px;border:1px solid #333;background:#090909;color:#fff;border-radius:10px}button{cursor:pointer}.btn{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#151515;color:#fff;font-weight:700}.log{padding:12px;border:1px solid #222;border-radius:12px;margin-top:10px;background:#090909}small{color:#aaa}.good{color:#9fe3a5}.bad{color:#ff9f9f}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>J · AXIOM SIM</h1><div class="muted">Paper trading only · liquidity screened · protected stop simulation.</div></div><button class="pill" onclick="location.href='/'">Back to J</button></div><div class="grid"><div class="card"><b>Rookie Sim</b><div id="rookieEq">$1,000.00</div></div><div class="card"><b>Open Trades</b><div id="openCount">0</div></div><div class="card"><b>Closed Trades</b><div id="closedCount">0</div></div></div><div class="card"><h3>SIM ENTRY</h3><div class="row"><input id="token" placeholder="Token / contract address"><input id="price" type="number" step="any" placeholder="Market price"><input id="size" type="number" value="25" placeholder="Position $"><input id="stop" type="number" value="10" placeholder="Stop %"><input id="target" type="number" value="20" placeholder="Target %"><input id="score" type="number" min="0" max="100" placeholder="J Score"></div><div class="row" style="margin-top:10px"><button class="btn" id="live">SCAN + GET PRICE</button><button class="btn" id="buy">BUY IN SIM</button><button class="btn" id="refresh">REFRESH OPEN TRADES</button></div><div id="msg" class="muted" style="margin-top:10px"></div></div><div class="card" style="margin-top:16px"><h3>TRADE JOURNAL</h3><div id="journal"></div></div></div><script>const KEY='j_axiom_standalone_v2',FEE=.005,SLIP=.01,MIN_LIQ=10000;const $=s=>document.querySelector(s);const fmt=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});let lastQuote=null;function state(){try{return JSON.parse(localStorage.getItem(KEY))||{cash:1000,start:1000,trades:[]}}catch{return{cash:1000,start:1000,trades:[]}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}async function quote(q){const r=await fetch('/api/meme-scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Price lookup failed');const p=(d.pairs||[]).sort((a,b)=>(Number(b.liquidityUsd)||0)-(Number(a.liquidityUsd)||0))[0];if(!p||!Number(p.priceUsd))throw new Error('No live price found');return p}function closeAt(s,t,market,reason){const raw=reason==='stop'?t.stopPrice:reason==='target'?t.targetPrice:market;const exit=raw*(1-SLIP),gross=t.qty*exit,net=gross*(1-FEE),pnl=net-t.totalCost;t.status='closed';t.exit=exit;t.exitReason=reason;t.pnlUsd=pnl;t.pnlPct=pnl/t.totalCost*100;t.closedAt=new Date().toISOString();s.cash+=net}function render(){const s=state(),open=s.trades.filter(t=>t.status==='open'),closed=s.trades.filter(t=>t.status==='closed'),eq=s.cash+open.reduce((z,t)=>z+(t.markValue||t.size),0);$('#rookieEq').textContent=fmt(eq);$('#openCount').textContent=open.length;$('#closedCount').textContent=closed.length;$('#journal').innerHTML=s.trades.length?s.trades.map(t=>`<div class="log"><b>${t.token} · ${t.status.toUpperCase()}</b><br><small>Entry ${t.entry} · Size ${fmt(t.size)} · Stop ${t.stop}% · Target ${t.target}% · Liquidity ${fmt(t.entryLiquidity)}${t.status==='open'?` · Live ${(t.livePnlPct||0).toFixed(2)}%`:` · ${t.exitReason||'manual'} · P/L ${t.pnlPct.toFixed(2)}% (${fmt(t.pnlUsd)})`}</small>${t.status==='open'?`<div style="margin-top:8px"><input data-exit="${t.id}" type="number" step="any" placeholder="Exit market price" style="padding:8px;background:#090909;border:1px solid #333;color:#fff;border-radius:8px"><button data-sell="${t.id}" class="pill">SELL SIM</button></div>`:''}</div>`).join(''):'<div class="muted">No simulated trades yet.</div>';document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const s=state(),t=s.trades.find(x=>x.id==b.dataset.sell),m=Number(document.querySelector(`[data-exit="${t.id}"]`).value);if(!m)return;closeAt(s,t,m,'manual');save(s);render()})}$('#live').onclick=async()=>{const q=$('#token').value.trim();if(!q)return;lastQuote=null;$('#msg').textContent='Scanning price and liquidity…';try{const p=await quote(q),liq=Number(p.liquidityUsd)||0;lastQuote={token:q,price:Number(p.priceUsd),liq,volume:Number(p.volume24h)||0};$('#price').value=p.priceUsd;if(liq<MIN_LIQ){$('#msg').innerHTML=`<span class="bad">NO TRADE · liquidity ${fmt(liq)} is below ${fmt(MIN_LIQ)} minimum.</span>`}else{$('#msg').innerHTML=`<span class="good">QUALIFIED</span> · Live ${p.priceUsd} · Liquidity ${fmt(liq)} · 24h volume ${fmt(p.volume24h)}`}}catch(e){$('#msg').textContent=e.message}};$('#buy').onclick=()=>{const s=state(),token=$('#token').value.trim(),market=Number($('#price').value),size=Number($('#size').value),stop=Math.abs(Number($('#stop').value)),target=Math.abs(Number($('#target').value)),score=Number($('#score').value||0);if(!token||!market||!size)return alert('Token, market price, and position size are required.');if(!lastQuote||lastQuote.token!==token||Math.abs(lastQuote.price-market)/lastQuote.price>.02)return alert('Run SCAN + GET PRICE immediately before entering.');if(lastQuote.liq<MIN_LIQ)return alert(`NO TRADE: liquidity must be at least ${fmt(MIN_LIQ)}.`);const open=s.trades.filter(t=>t.status==='open'),eq=s.cash+open.reduce((z,t)=>z+(t.markValue||t.size),0),max=eq*.05;if(size>max)return alert(`Max simulated position is ${fmt(max)} (5% of equity).`);const entry=market*(1+SLIP),fee=size*FEE,totalCost=size+fee;if(totalCost>s.cash)return alert('Not enough virtual cash.');s.cash-=totalCost;s.trades.unshift({id:Date.now(),token,entryMarket:market,entry,size,totalCost,qty:size/entry,stop,target,score,status:'open',markValue:size,entryLiquidity:lastQuote.liq,openedAt:new Date().toISOString(),stopPrice:entry*(1-stop/100),targetPrice:entry*(1+target/100)});save(s);lastQuote=null;render()};$('#refresh').onclick=async()=>{const s=state();for(const t of s.trades.filter(x=>x.status==='open')){try{const p=await quote(t.token),m=Number(p.priceUsd),liq=Number(p.liquidityUsd)||0;t.markValue=t.qty*m;t.livePnlPct=(t.markValue-t.totalCost)/t.totalCost*100;t.lastLiquidity=liq;if(m<=t.stopPrice)closeAt(s,t,m,'stop');else if(m>=t.targetPrice)closeAt(s,t,m,'target')}catch(e){t.refreshError=e.message}}save(s);render()};render();</script></body></html>
