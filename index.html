<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ALFRED</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}body{user-select:none;-webkit-user-select:none;background:radial-gradient(circle at 50% 48%,#101010 0,#050505 38%,#000 76%)}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.grain{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 0.45px,transparent .55px);background-size:7px 7px;mask-image:radial-gradient(circle at center,#000 15%,transparent 75%)}
.orbWrap{position:relative;z-index:3;width:min(82vw,560px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 0 26px #ffffff2c)}#orb{width:100%;height:100%;display:block}.orbHalo{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffffff16 0,#ffffff08 28%,transparent 70%);filter:blur(18px);animation:breathe 4s ease-in-out infinite}
.listening .orbWrap{filter:drop-shadow(0 0 34px #ffffff48)}.thinking .orbWrap{filter:drop-shadow(0 0 42px #ffffff60)}.speaking .orbWrap{filter:drop-shadow(0 0 50px #ffffff75)}
.activateBtn{position:absolute;z-index:10;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);border:1px solid #ffffff55;background:#0b0b0be6;color:#fff;border-radius:999px;padding:12px 20px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 24px #ffffff18;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .25s ease,transform .25s ease}.activateBtn:active{transform:translateX(-50%) scale(.97)}.activateBtn.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px)}
#status,#response,#hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@media(max-width:640px){.orbWrap{width:92vw}.activateBtn{bottom:max(22px,env(safe-area-inset-bottom));padding:12px 18px;font-size:12px}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="ALFRED voice interface">
  <div class="grain"></div>
  <div class="orbWrap"><div class="orbHalo"></div><canvas id="orb" width="600" height="600" aria-hidden="true"></canvas></div>
  <button class="activateBtn" id="activateBtn" type="button">Start Alfred</button>
  <div id="response"></div><div id="status"></div><div id="hint"></div>
</main>
<script>
(()=>{const canvas=document.getElementById('orb'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let w=600,h=600,t=0;const pts=[];const count=320;for(let i=0;i<count;i++){const u=Math.random(),v=Math.random(),theta=2*Math.PI*u,phi=Math.acos(2*v-1),r=.72+Math.random()*.28;pts.push({x:r*Math.sin(phi)*Math.cos(theta),y:r*Math.sin(phi)*Math.sin(theta),z:r*Math.cos(phi),s:.5+Math.random()*1.5,p:Math.random()*Math.PI*2})}function resize(){const d=Math.min(devicePixelRatio||1,2),size=Math.max(320,Math.floor(canvas.clientWidth*d));canvas.width=size;canvas.height=size;w=h=size}new ResizeObserver(resize).observe(canvas);resize();function frame(){requestAnimationFrame(frame);t+=.012;ctx.clearRect(0,0,w,h);const listening=stage.classList.contains('listening'),thinking=stage.classList.contains('thinking'),speaking=stage.classList.contains('speaking');const speed=thinking?2.4:listening?1.45:speaking?1.8:1;const pulse=1+(speaking?.07:listening?.045:.025)*Math.sin(t*(speaking?9:listening?5:2.5));const rot=t*.48*speed,cr=Math.cos(rot),sr=Math.sin(rot),tilt=.36+Math.sin(t*.33)*.08,ct=Math.cos(tilt),st=Math.sin(tilt);const cx=w/2,cy=h/2,scale=w*.29*pulse;const draw=[];for(const q of pts){let x=q.x*cr-q.z*sr,z=q.x*sr+q.z*cr,y=q.y;const yy=y*ct-z*st,zz=y*st+z*ct;const wobble=(thinking?.055:listening?.032:speaking?.045:.018)*Math.sin(t*3+q.p);x*=1+wobble;y=yy*(1-wobble*.45);z=zz;const depth=(z+1.25)/2.5;draw.push({x:cx+x*scale*(.8+.25*depth),y:cy+y*scale*(.8+.25*depth),z,depth,s:q.s})}draw.sort((a,b)=>a.z-b.z);for(const p of draw){const a=.18+.82*p.depth,rad=(.65+p.s*1.05)*(thinking?1.15:speaking?1.2:1);ctx.beginPath();ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=(speaking?12:listening?8:5)*p.depth;ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0}frame()})();
</script>
<script src="./app.js"></script>
</body>
</html>
