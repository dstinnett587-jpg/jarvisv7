<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>J</title><link rel="stylesheet" href="./j-tablet.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}body{user-select:none;-webkit-user-select:none;background:radial-gradient(circle at 50% 48%,#101010 0,#050505 38%,#000 76%)}.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.grain{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff .45px,transparent .55px);background-size:7px 7px;mask-image:radial-gradient(circle at center,#000 15%,transparent 75%)}
.orbWrap{position:relative;z-index:3;width:min(82vw,560px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 0 26px #ffffff2c)}#orb{width:100%;height:100%;display:block}.orbHalo{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffffff16 0,#ffffff08 28%,transparent 70%);filter:blur(18px);animation:breathe 4s ease-in-out infinite}.listening .orbWrap{filter:drop-shadow(0 0 34px #ffffff48)}.thinking .orbWrap{filter:drop-shadow(0 0 42px #ffffff60)}.speaking .orbWrap{filter:drop-shadow(0 0 50px #ffffff75)}
.hud{position:absolute;z-index:5;width:180px;min-height:64px;padding:10px 12px;border:1px solid #ffffff24;border-radius:12px;background:linear-gradient(135deg,#0c0c0ce8,#11111188);box-shadow:inset 0 0 22px #ffffff08,0 0 28px #000;backdrop-filter:blur(10px);opacity:.82;pointer-events:auto}.hud:not(.h1){display:none}.hud .k{font-size:8px;letter-spacing:.18em;color:#ffffff80;margin-bottom:7px}.hud .v{font-size:12px;font-weight:700;letter-spacing:.05em}.hud .s{font-size:8px;color:#ffffff78;margin-top:4px;line-height:1.35}.h1{top:max(46px,calc(env(safe-area-inset-top) + 18px));left:50%;transform:translateX(-50%);text-align:center}
.activateBtn{position:absolute;z-index:10;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);border:1px solid #ffffff55;background:#0b0b0be6;color:#fff;border-radius:999px;padding:13px 24px;font:700 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 24px #ffffff18;backdrop-filter:blur(14px);transition:.2s}.activateBtn:active{transform:translateX(-50%) scale(.97)}.activateBtn.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px)}
.audioStatus{position:absolute;z-index:9;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom) + 54px));transform:translateX(-50%);font-size:10px;letter-spacing:.06em;color:#aaa;text-align:center;max-width:88vw}.drawer,.preview,.jTablet{display:none!important}#status,#response,#hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}@media(max-width:640px){.orbWrap{width:88vw}.hud{width:160px}.activateBtn{bottom:max(22px,env(safe-area-inset-bottom));padding:12px 20px;font-size:12px}.audioStatus{bottom:max(74px,calc(env(safe-area-inset-bottom) + 50px))}}
</style></head><body><main class="stage" id="stage"><div class="grain"></div>
<div class="hud h1" data-panel="core"><div class="k">J</div><div class="v">READY</div><div class="s">Ask once. J pulls it up.</div></div>
<div class="hud h2" data-panel="business"><div class="k">BUSINESS MODE</div><div class="v">SALES TOOLS READY</div><div class="s">Find · build · outreach · invoice</div></div>
<div class="hud h3" data-panel="memory"><div class="k">MEMORY</div><div class="v">CONTEXT ACTIVE</div><div class="s">Recent conversation stored locally</div></div>
<div class="hud h4" data-panel="tools"><div class="k">TOOLS</div><div class="v">WEATHER · LOCATION</div><div class="s">Live context + business search</div></div>
<div class="orbWrap"><div class="orbHalo"></div><canvas id="orb" width="600" height="600"></canvas></div><div class="audioStatus" id="audioStatus">Tap J to enable microphone</div><button class="activateBtn" id="activateBtn">J</button><div id="response"></div><div id="status"></div><div id="hint"></div></main>
<section class="drawer" id="hudDrawer"><div class="drawerTop"><div class="drawerTitle" id="drawerTitle">J</div><button class="closeDrawer" id="closeDrawer">Close</button></div><div id="drawerBody"></div></section>
<section class="preview" id="sitePreview"><div class="previewBar"><div class="previewTitle">J</div><button class="previewClose" id="closePreview">Close</button></div><iframe id="siteFrame" sandbox="allow-forms allow-popups allow-same-origin"></iframe></section>
<section class="jTablet" id="jTablet" aria-label="J tablet dashboard"><div class="tabletHead" id="tabletHandle"><div class="tabletBrand">J</div><div class="tabletControls"><button id="tabletMin" aria-label="Minimize">−</button><button id="tabletClose" aria-label="Close">×</button></div></div><div class="tabletTabs"><button data-jtab="business" class="active">BUSINESS</button><button data-jtab="money">MONEY</button><button data-jtab="system">SYSTEM</button><button data-jtab="weather">WEATHER</button><button data-jtab="memory">MEMORY</button></div><div class="tabletBody" id="tabletBody"></div><div class="stopBar"><button id="businessStop">STOP Business</button></div></section>
<script>(()=>{const canvas=document.getElementById('orb'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let w=600,h=600,t=0;const pts=[];for(let i=0;i<320;i++){const u=Math.random(),v=Math.random(),theta=2*Math.PI*u,phi=Math.acos(2*v-1),r=.72+Math.random()*.28;pts.push({x:r*Math.sin(phi)*Math.cos(theta),y:r*Math.sin(phi)*Math.sin(theta),z:r*Math.cos(phi),s:.5+Math.random()*1.5,p:Math.random()*Math.PI*2})}function resize(){const d=Math.min(devicePixelRatio||1,2),size=Math.max(320,Math.floor(canvas.clientWidth*d));canvas.width=size;canvas.height=size;w=h=size}new ResizeObserver(resize).observe(canvas);resize();function frame(){requestAnimationFrame(frame);t+=.012;ctx.clearRect(0,0,w,h);const listening=stage.classList.contains('listening'),thinking=stage.classList.contains('thinking'),speaking=stage.classList.contains('speaking'),speed=thinking?2.4:listening?1.45:speaking?1.8:1,pulse=1+(speaking?.07:listening?.045:.025)*Math.sin(t*(speaking?9:listening?5:2.5)),rot=t*.48*speed,cr=Math.cos(rot),sr=Math.sin(rot),tilt=.36+Math.sin(t*.33)*.08,ct=Math.cos(tilt),st=Math.sin(tilt),cx=w/2,cy=h/2,scale=w*.29*pulse,draw=[];for(const q of pts){let x=q.x*cr-q.z*sr,z=q.x*sr+q.z*cr,y=q.y,yy=y*ct-z*st,zz=y*st+z*ct,wobble=(thinking?.055:listening?.032:speaking?.045:.018)*Math.sin(t*3+q.p);x*=1+wobble;y=yy*(1-wobble*.45);z=zz;const depth=(z+1.25)/2.5;draw.push({x:cx+x*scale*(.8+.25*depth),y:cy+y*scale*(.8+.25*depth),z,depth,s:q.s})}draw.sort((a,b)=>a.z-b.z);for(const p of draw){ctx.beginPath();ctx.fillStyle=`rgba(255,255,255,${.18+.82*p.depth})`;ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=(speaking?12:listening?8:5)*p.depth;ctx.arc(p.x,p.y,(.65+p.s*1.05)*(thinking?1.15:speaking?1.2:1),0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0}frame()})();</script>
<script src="./j-owner-guard.js?v=20260820-1"></script><script src="./j-shared-state.js?v=20260820-2"></script><script src="./j-phone-audio.js?v=20260820-2"></script><script src="./j-safety.js"></script><script src="./app.js"></script><script src="./j-shell.js"></script><script src="./j-desktop-monitor.js"></script><script src="./j-screen-director.js"></script><script src="./j-voice-enhance.js"></script><script src="./j-remote-sync.js?v=20260820-fast-1"></script><script src="./j-car-mode.js"></script><script type="module" src="./j-hand-control.js"></script><script>(()=>{const b=document.getElementById('activateBtn'),s=document.getElementById('audioStatus');if(!b||!s)return;b.addEventListener('click',async()=>{s.textContent='Enabling microphone…';try{await window.JPhoneAudio?.prepare?.();s.textContent=window.JPhoneAudio?.describe?.()||'Microphone ready';}catch(e){s.textContent='Microphone permission needed';}});window.addEventListener('j-phone-audio-route',()=>{s.textContent=window.JPhoneAudio?.describe?.()||'Audio ready';});})();</script></body></html>
