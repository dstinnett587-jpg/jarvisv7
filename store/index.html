<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maisonvere — New Arrivals</title>
<meta name="description" content="Maisonvere — New Arrivals. Move With Purpose.">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f3ef;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:12px}button,select{font:inherit;color:inherit}button{cursor:pointer}.top{height:74px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;border-bottom:1px solid #111;background:#f4f3ef;position:sticky;top:0;z-index:30}.left,.right{display:flex;align-items:center;gap:22px;text-transform:uppercase}.right{justify-content:flex-end}.logo{font-family:Georgia,'Times New Roman',serif;font-size:25px;letter-spacing:.02em;text-transform:lowercase}.link,.textbtn{background:none;border:0;padding:0;text-decoration:none;color:#111;text-transform:uppercase}.collection{padding:42px 20px 20px}.crumb{margin-bottom:18px;color:#444}.collection h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:42px;margin:0 0 38px;letter-spacing:-.02em}.tools{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #111;border-bottom:1px solid #111;padding:13px 0;text-transform:uppercase}.tools-right{display:flex;align-items:center;gap:15px}.sort{border:0;background:transparent;text-transform:uppercase;padding:0 22px 0 0}.count{color:#555}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-left:1px solid #111}.product{border-right:1px solid #111;border-bottom:1px solid #111;background:#f4f3ef;min-width:0}.visual{aspect-ratio:4/5;background:#ecebe6;display:grid;place-items:center;position:relative;overflow:hidden}.visual:before{content:'MV';font-family:Georgia,'Times New Roman',serif;font-size:clamp(52px,8vw,110px);color:#d8d7d1;letter-spacing:-.08em}.status{position:absolute;left:12px;top:12px;font-size:10px;text-transform:uppercase}.product-info{padding:12px 12px 15px;min-height:97px}.name{font-size:11px;text-transform:uppercase;line-height:1.25}.meta{font-size:10px;color:#555;text-transform:uppercase;margin-top:5px}.price{font-size:11px;margin-top:5px}.quick{width:100%;background:transparent;border:0;border-top:1px solid #111;text-transform:uppercase;text-align:left;padding:10px 12px;font-size:10px}.footer{display:grid;grid-template-columns:1fr auto;gap:20px;padding:28px 20px 38px;border-top:1px solid #111}.footlinks{display:flex;gap:24px;text-transform:uppercase}.copyright{text-transform:lowercase}.drawer,.filters{position:fixed;top:0;right:0;width:min(420px,100%);height:100vh;background:#f4f3ef;border-left:1px solid #111;z-index:60;transform:translateX(100%);transition:.22s ease;display:flex;flex-direction:column}.drawer.open,.filters.open{transform:none}.panel-head{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #111;text-transform:uppercase}.panel-body{padding:18px;overflow:auto;flex:1}.panel-foot{border-top:1px solid #111;padding:16px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:50;opacity:0;pointer-events:none;transition:.2s}.overlay.open{opacity:1;pointer-events:auto}.filter-group{padding:17px 0;border-bottom:1px solid #bbb}.filter-group b{display:block;text-transform:uppercase;margin-bottom:10px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.checks label{text-transform:uppercase}.cartitem{padding:14px 0;border-bottom:1px solid #bbb;display:flex;justify-content:space-between;gap:14px;text-transform:uppercase}.total{display:flex;justify-content:space-between;text-transform:uppercase;margin-bottom:12px}.checkout{width:100%;background:#111;color:#fff;border:1px solid #111;padding:12px;text-transform:uppercase}.note{font-size:10px;color:#666;line-height:1.4;margin-top:9px}.mobile{display:none}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.top{grid-template-columns:1fr auto;height:64px}.left{display:none}.right{gap:14px}.mobile{display:inline}.logo{justify-self:start;font-size:22px}.collection{padding:28px 12px 14px}.collection h1{font-size:34px;margin-bottom:28px}.grid{grid-template-columns:repeat(2,1fr)}.tools{font-size:10px}.sort{max-width:118px}.footer{grid-template-columns:1fr}.footlinks{gap:15px;flex-wrap:wrap}.product-info{min-height:91px;padding:10px}.visual .status{left:8px;top:8px}}
</style>
</head>
<body>
<header class="top">
<div class="left"><a class="link" href="#">Shop</a><a class="link" href="#">Campaign</a><a class="link" href="#">Info</a></div>
<div class="logo">maisonvere</div>
<div class="right"><button class="textbtn mobile">Menu</button><button class="textbtn" id="searchBtn">Search</button><button class="textbtn" id="cartOpen">Cart (<span id="cartCount">0</span>)</button></div>
</header>
<main>
<section class="collection">
<div class="crumb">Maisonvere &gt;</div>
<h1>New Arrivals</h1>
<div class="tools"><button class="textbtn" id="filterOpen">Filters</button><div class="tools-right"><span class="count" id="count"></span><select class="sort" id="sort"><option value="latest">Sort By Latest Arrivals</option><option value="high">Price: high to low</option><option value="low">Price: low to high</option></select></div></div>
</section>
<section class="grid" id="products"></section>
</main>
<footer class="footer"><div class="footlinks"><a class="link" href="#">Stockists</a><a class="link" href="#">Contact</a><a class="link" href="#">Legal</a><a class="link" href="#">Instagram</a></div><div class="copyright">maisonvere © 2026</div></footer>
<div class="overlay" id="overlay"></div>
<aside class="filters" id="filters"><div class="panel-head"><b>Filters</b><button class="textbtn closePanel">Close</button></div><div class="panel-body"><div class="filter-group"><b>Category</b><div class="checks"><label><input type="checkbox" value="Outerwear"> Outerwear</label><label><input type="checkbox" value="T-Shirts"> T-Shirts</label><label><input type="checkbox" value="Bottoms"> Bottoms</label><label><input type="checkbox" value="Accessories"> Accessories</label></div></div><div class="filter-group"><b>Size</b><div class="checks"><label><input type="checkbox"> S</label><label><input type="checkbox"> M</label><label><input type="checkbox"> L</label><label><input type="checkbox"> XL</label><label><input type="checkbox"> 30</label><label><input type="checkbox"> 32</label></div></div><div class="filter-group"><b>Availability</b><div class="checks"><label><input type="checkbox"> In stock</label><label><input type="checkbox"> Sold out</label></div></div></div><div class="panel-foot"><button class="checkout closePanel">Show Results</button></div></aside>
<aside class="drawer" id="drawer"><div class="panel-head"><b>Cart</b><button class="textbtn closePanel">Close</button></div><div class="panel-body" id="cartBody"></div><div class="panel-foot"><div class="total"><span>Subtotal</span><b id="subtotal">$0.00</b></div><button class="checkout" id="checkout">Checkout</button><div class="note">Preview checkout only. Connect your live commerce/payment account before accepting orders.</div></div></aside>
<script>
const PRODUCTS=[
{name:'Distressed Zip Hoodie',price:125,color:'Washed Black',cat:'Outerwear',status:'New'},
{name:'MV Fireman Tee',price:65,color:'Dirty White',cat:'T-Shirts',status:'New'},
{name:'MV World Tee',price:65,color:'Faded Black',cat:'T-Shirts',status:'New'},
{name:'Carpenter Jeans',price:175,color:'Deep Black',cat:'Bottoms',status:'New'},
{name:'Maisonvere Distressed Cap',price:55,color:'Black / Grey',cat:'Accessories',status:'New'},
{name:'MV Chain',price:200,color:'Antique Silver',cat:'Accessories',status:'New'},
{name:'Distressed Zip Hoodie',price:125,color:'Bone White',cat:'Outerwear',status:'Limited'},
{name:'MV Graphic Tee',price:65,color:'Washed Grey',cat:'T-Shirts',status:'New'},
{name:'MV Carpenter Jeans',price:175,color:'Washed Indigo',cat:'Bottoms',status:'Limited'},
{name:'Maisonvere Beanie',price:55,color:'Black',cat:'Accessories',status:'New'},
{name:'MV Belt',price:125,color:'Black / Silver',cat:'Accessories',status:'New'},
{name:'Cropped Distressed Tee',price:65,color:'Faded White',cat:'T-Shirts',status:'New'}
];
let cart=JSON.parse(localStorage.getItem('mv_cart')||'[]');let current=[...PRODUCTS];
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
function renderProducts(){document.getElementById('count').textContent=current.length+' pieces';document.getElementById('products').innerHTML=current.map((p,i)=>`<article class="product"><div class="visual"><span class="status">${p.status}</span></div><div class="product-info"><div class="name">${p.name}</div><div class="meta">${p.color}</div><div class="price">${money(p.price)}</div></div><button class="quick" onclick="addCart(${PRODUCTS.indexOf(p)})">Add to cart</button></article>`).join('')}
function renderCart(){document.getElementById('cartCount').textContent=cart.length;document.getElementById('cartBody').innerHTML=cart.length?cart.map((p,i)=>`<div class="cartitem"><div>${p.name}<div class="meta">${p.color}</div></div><div style="text-align:right">${money(p.price)}<br><button class="textbtn" style="margin-top:7px;color:#666" onclick="removeCart(${i})">Remove</button></div></div>`).join(''):'Your cart is currently empty.';document.getElementById('subtotal').textContent=money(cart.reduce((a,p)=>a+p.price,0))}
function addCart(i){cart.push(PRODUCTS[i]);localStorage.setItem('mv_cart',JSON.stringify(cart));renderCart();openPanel('drawer')}
function removeCart(i){cart.splice(i,1);localStorage.setItem('mv_cart',JSON.stringify(cart));renderCart()}
function openPanel(id){document.getElementById(id).classList.add('open');document.getElementById('overlay').classList.add('open')}
function closePanels(){document.querySelectorAll('.drawer,.filters').forEach(x=>x.classList.remove('open'));document.getElementById('overlay').classList.remove('open')}
document.getElementById('cartOpen').onclick=()=>openPanel('drawer');document.getElementById('filterOpen').onclick=()=>openPanel('filters');document.getElementById('overlay').onclick=closePanels;document.querySelectorAll('.closePanel').forEach(b=>b.onclick=closePanels);document.getElementById('sort').onchange=e=>{current=[...PRODUCTS];if(e.target.value==='high')current.sort((a,b)=>b.price-a.price);if(e.target.value==='low')current.sort((a,b)=>a.price-b.price);renderProducts()};document.getElementById('checkout').onclick=()=>alert('Maisonvere checkout is still in preview mode.');document.getElementById('searchBtn').onclick=()=>{const q=prompt('Search Maisonvere');if(q===null)return;current=PRODUCTS.filter(p=>(p.name+' '+p.color+' '+p.cat).toLowerCase().includes(q.toLowerCase()));renderProducts()};renderProducts();renderCart();
</script>
</body>
</html>
