<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maisonvere — New Arrivals</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f3ef;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:12px}button,select{font:inherit;color:inherit}button{cursor:pointer}.top{height:86px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;border-bottom:1px solid #111;background:#f4f3ef;position:sticky;top:0;z-index:30}.left,.right{display:flex;align-items:center;gap:22px;text-transform:uppercase}.right{justify-content:flex-end}.logo{display:flex;align-items:center;justify-content:center;height:76px;min-width:94px}.logo img{display:block;height:68px;width:auto;object-fit:contain}.link,.textbtn{background:none;border:0;padding:0;text-decoration:none;color:#111;text-transform:uppercase}.collection{padding:42px 20px 20px}.crumb{margin-bottom:18px;color:#444}.collection h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:42px;margin:0 0 38px}.tools{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #111;border-bottom:1px solid #111;padding:13px 0;text-transform:uppercase}.tools-right{display:flex;align-items:center;gap:15px}.sort{border:0;background:transparent;text-transform:uppercase}.count{color:#555}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #111}.product{border-right:1px solid #111;border-bottom:1px solid #111;min-width:0}.visual{aspect-ratio:4/5;background:#e9e8e2;position:relative;overflow:hidden;display:grid;place-items:center}.visual.placeholder:before{content:'MV';font-family:Georgia,'Times New Roman',serif;font-size:clamp(48px,7vw,100px);color:#d4d3cd}.visual img{width:100%;height:100%;object-fit:cover;display:block}.status{position:absolute;left:12px;top:12px;font-size:10px;text-transform:uppercase;background:#f4f3ef;padding:3px 5px}.product-info{padding:12px;min-height:96px}.name{font-size:11px;text-transform:uppercase;line-height:1.3}.meta{font-size:10px;color:#555;text-transform:uppercase;margin-top:5px}.price{font-size:11px;margin-top:5px}.quick{width:100%;background:transparent;border:0;border-top:1px solid #111;text-transform:uppercase;text-align:left;padding:10px 12px;font-size:10px}.quick[disabled]{opacity:.45;cursor:default}.footer{display:grid;grid-template-columns:1fr auto;gap:20px;padding:28px 20px 38px;border-top:1px solid #111}.footlinks{display:flex;gap:24px;text-transform:uppercase}.drawer{position:fixed;top:0;right:0;width:min(420px,100%);height:100vh;background:#f4f3ef;border-left:1px solid #111;z-index:60;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column}.drawer.open{transform:none}.panel-head{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #111;text-transform:uppercase}.panel-body{padding:18px;overflow:auto;flex:1}.panel-foot{border-top:1px solid #111;padding:16px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:50;opacity:0;pointer-events:none}.overlay.open{opacity:1;pointer-events:auto}.cartitem{padding:14px 0;border-bottom:1px solid #bbb;display:flex;justify-content:space-between;gap:14px;text-transform:uppercase}.checkout{width:100%;background:#111;color:#fff;border:1px solid #111;padding:12px;text-transform:uppercase}.total{display:flex;justify-content:space-between;text-transform:uppercase;margin-bottom:12px}.mobile{display:none}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.top{grid-template-columns:1fr auto;height:72px;padding:0 12px}.left{display:none}.right{gap:14px}.mobile{display:inline}.logo{justify-self:start;height:64px}.logo img{height:56px}.collection{padding:28px 12px 14px}.collection h1{font-size:34px;margin-bottom:28px}.grid{grid-template-columns:repeat(2,1fr)}.footer{grid-template-columns:1fr}.footlinks{gap:15px;flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><div class="left"><a class="link" href="#shop">Shop</a><a class="link" href="https://www.instagram.com/maisonvere_" target="_blank" rel="noopener">Instagram</a><a class="link" href="#info">Info</a></div><a class="logo" href="/store/"><img src="/store/mv-logo.png" alt="Maisonvere MV logo"></a><div class="right"><button class="textbtn mobile" onclick="document.getElementById('shop').scrollIntoView()">Menu</button><button class="textbtn" id="searchBtn">Search</button><button class="textbtn" id="cartOpen">Cart (<span id="cartCount">0</span>)</button></div></header>
<main><section class="collection" id="shop"><div class="crumb">Maisonvere &gt;</div><h1>New Arrivals</h1><div class="tools"><span>Maisonvere Collection</span><div class="tools-right"><span class="count" id="count"></span><select class="sort" id="sort"><option value="latest">Sort By Latest Arrivals</option><option value="high">Price: high to low</option><option value="low">Price: low to high</option></select></div></div></section><section class="grid" id="products"></section></main>
<footer class="footer" id="info"><div class="footlinks"><a class="link" href="https://www.instagram.com/maisonvere_" target="_blank" rel="noopener">Instagram</a><a class="link" href="#">Contact</a><a class="link" href="#">Legal</a></div><div>maisonvere © 2026</div></footer>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="panel-head"><b>Cart</b><button class="textbtn" id="closeCart">Close</button></div><div class="panel-body" id="cartBody"></div><div class="panel-foot"><div class="total"><span>Subtotal</span><b id="subtotal">$0.00</b></div><button class="checkout" id="checkout">Checkout</button></div></aside>
<script>
const PRODUCTS=[
{name:'Camo Outerwear',color:'Camouflage',cat:'Outerwear',price:null,status:'New',image:null},
{name:'MV Sleeveless Graphic Tee',color:'White',cat:'T-Shirts',price:65,status:'New',image:'/store/campaign-1.b64'},
{name:'Distressed Zip Hoodie',color:'Washed Grey',cat:'Outerwear',price:125,status:'New',image:'/store/campaign-2.b64'},
{name:'Black Hoodie / Camo Short Look',color:'Black / Camo',cat:'Sets',price:null,status:'New',image:null},
{name:'MV Graphic Zip Hoodie',color:'Washed Black',cat:'Outerwear',price:125,status:'New',image:'/store/campaign-3.b64'},
{name:'Brown Outerwear',color:'Brown',cat:'Outerwear',price:null,status:'New',image:null}
];
let cart=JSON.parse(localStorage.getItem('mv_cart')||'[]'),current=[...PRODUCTS];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
async function imageData(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw 0;return 'data:image/webp;base64,'+(await r.text()).trim()}
async function renderProducts(){document.getElementById('count').textContent=current.length+' pieces';const root=document.getElementById('products');root.innerHTML=current.map((p,i)=>`<article class="product"><div class="visual ${p.image?'':'placeholder'}" id="v${i}">${p.image?'':' '}<span class="status">${p.status}</span></div><div class="product-info"><div class="name">${p.name}</div><div class="meta">${p.color}</div><div class="price">${p.price?money(p.price):'Price TBA'}</div></div><button class="quick" ${p.price?'':'disabled'} onclick="addCart(${PRODUCTS.indexOf(p)})">${p.price?'Add to cart':'Coming soon'}</button></article>`).join('');for(let i=0;i<current.length;i++){const p=current[i];if(p.image){try{const src=await imageData(p.image);document.getElementById('v'+i).insertAdjacentHTML('afterbegin',`<img src="${src}" alt="${p.name}">`)}catch(e){document.getElementById('v'+i).classList.add('placeholder')}}}}
function renderCart(){document.getElementById('cartCount').textContent=cart.length;document.getElementById('cartBody').innerHTML=cart.length?cart.map((p,i)=>`<div class="cartitem"><div>${p.name}<div class="meta">${p.color}</div></div><div style="text-align:right">${money(p.price)}<br><button class="textbtn" onclick="removeCart(${i})">Remove</button></div></div>`).join(''):'Your cart is currently empty.';document.getElementById('subtotal').textContent=money(cart.reduce((a,p)=>a+p.price,0))}
function addCart(i){if(!PRODUCTS[i].price)return;cart.push(PRODUCTS[i]);localStorage.setItem('mv_cart',JSON.stringify(cart));renderCart();openCart()}function removeCart(i){cart.splice(i,1);localStorage.setItem('mv_cart',JSON.stringify(cart));renderCart()}function openCart(){drawer.classList.add('open');overlay.classList.add('open')}function closeCart(){drawer.classList.remove('open');overlay.classList.remove('open')}
cartOpen.onclick=openCart;closeCart.onclick=closeCart;overlay.onclick=closeCart;sort.onchange=e=>{current=[...PRODUCTS];if(e.target.value==='high')current.sort((a,b)=>(b.price||-1)-(a.price||-1));if(e.target.value==='low')current.sort((a,b)=>(a.price??999999)-(b.price??999999));renderProducts()};searchBtn.onclick=()=>{const q=prompt('Search Maisonvere');if(q===null)return;current=PRODUCTS.filter(p=>(p.name+' '+p.color+' '+p.cat).toLowerCase().includes(q.toLowerCase()));renderProducts()};checkout.onclick=()=>alert('Maisonvere checkout is still in preview mode.');renderProducts();renderCart();
</script></body></html>
